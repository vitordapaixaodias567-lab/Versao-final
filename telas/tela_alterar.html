 <nav class="nave-bar">

<!--Fim nav-bar-->

<!--Inicio Área de alteradodos-->
    <div class="titulo-central">
    <img src="../img/gota-logo.png" alt="">
    <h1>ALTERAR DADOS</h1>
    <p>Atualize suas informações quando precisar</p>
    </div>

    <section class="card-agendamento">
    <form id="form-alterar">
       <div>
            <div class="input-ordem">
                <div class="input-label">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Digite o CPF completo: 000.000.000-00" inputmode="numeric" required>
                </div>

                <div class="input-label">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" pattern="\(\d{2}\) \d{4,5}-\d{4}" title="Digite o telefone com DDD: (44) 00000-0000" inputmode="numeric" required>
                </div>
            </div>

            <div class="input-ordem">
                <div class="input-label">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" required>
                </div>

                <div class="input-label">
                <label for="cep">CEP:</label>
                <input type="text" id="cep" pattern="\d{5}-\d{3}" title="Digite o CEP completo: 00000-000" inputmode="numeric" required>
                </div>
            </div>

            <div class="input-ordem">
                <div class="input-label">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" required>
                </div>

                <div class="input-label">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" required>
                </div>
            </div>

            <div class="input-ordem">
                <div class="input-label">
                <label for="rua">Rua:</label>
                <input type="text" id="rua" required>
                </div>

                <div class="input-label">
                <label for="numero-residencia">Numero Residencial:</label>
                <input type="number" id="numero-residencia" required>
                </div>
            </div>

            <p id="loading" style="display:none;">Salvando...</p>
            <button>Salvar alterações</button>
       </div>
    </form>
    </section>
<!--Fim da área de alterar cadastro-->
<div class="overlay" id="overlay"></div>
