<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_cadastro.css">
     <link rel="icon" type="image/png" href="../img/gota-logo.png">
    <title>Login Bio-Óleo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <!--Nav Bar-->
    <nav class="nave-bar">
    <div class="logo-titulo">
        <img src="../img/3d_green_gradient_recycle_sign-Photoroom.png" alt="">
        <h1>BIO-ÓLEO</h1>
    </div>
        
        <div class="navegacao">
            <a href="tela_abertura.html">INICIO</a>
            <a href="tela_sobre.html">SOBRE</a>
            <a href="tela_contato.html">CONTATO</a>
            <a href="tela_login.html"><span>LOGIN</span></a>
        </div>
    </nav>
    <!--Fim da Nav Bar-->

    <!--Card Login-->
    <div class="card-login">
        <div>
            <img src="../img/gota-logo.png" alt="">
            <h1>Bem Vindo!</h1>
            <p>Insira as Credenciais</p>
            <form action="" onsubmit="Login(event)">
                <input id="email" type="email" placeholder="Digite Seu email"  required>
                <input id="senha"  type="password" placeholder="Digite sua senha" required>
                <div id="loading" style="display:none;">Carregando...</div>
                <button type="submit">Entrar</button>
            </form>
            <p>Não possui cadastro? <a href="tela_cadastro.html">Cadastre-se</a></p>
        </div>
    </div>
  <!--Fim do Card Login-->

<script src="../scripts/mensagem.js"></script>
<script src="../scripts/script_login.js"></script>
</body>
</html>
